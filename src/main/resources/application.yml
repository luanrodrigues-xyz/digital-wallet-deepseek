spring:
  application:
    name: digital-wallet

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      # Bounds every row-lock wait. A timed-out request fails with 503 instead of
      # waiting forever. Deadlocks are prevented by ordered locking, not by this.
      connection-init-sql: "SET lock_timeout = '5s'"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    generator:
      write-bigdecimal-as-plain: true
    deserialization:
      fail-on-unknown-properties: true

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.wallet: INFO
